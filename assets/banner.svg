<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#060911"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><style>@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,30px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-20px) scale(1.2)}}@keyframes pulsePill{0%{opacity:.8;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes gridFade{0%{opacity:.12}}@keyframes particleFloat{0%{transform:translateY(0) scale(.8);opacity:.3}50%{transform:translateY(-20px) scale(1.2);opacity:.8}}.bg-orb{animation:floatOrb 12s ease-in-out infinite alternate}.bg-orb-2{animation:floatOrb2 15s ease-in-out infinite alternate}.pulse-pill{animation:pulsePill 4s ease-in-out infinite alternate}.grid-pulse{animation:gridFade 6s ease-in-out infinite alternate}.particle{animation:particleFloat 7s ease-in-out infinite}.particle-delay-1{animation-delay:-2s}.particle-delay-2{animation-delay:-4s}.particle-delay-3{animation-delay:-5.5s}.title-text{font-weight:800;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.subtitle-text{font-weight:400;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g filter="url(#softGlow)" opacity=".6"><circle cx="220" cy="140" r="160" fill="#38bdf8" class="bg-orb"/><circle cx="980" cy="240" r="190" fill="#a855f7" class="bg-orb-2"/><circle cx="620" cy="350" r="130" fill="#6366f1" class="bg-orb"/></g><g stroke="#fff" stroke-dasharray="3 3" stroke-width="1" class="grid-pulse" opacity=".15"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050" x2="1050" y1="0" y2="420"/></g><g fill="#38bdf8"><circle cx="180" cy="110" r="3" class="particle"/><circle cx="340" cy="320" r="4" fill="#a855f7" class="particle particle-delay-1"/><circle cx="890" cy="90" r="3.5" fill="#c084fc" class="particle particle-delay-2"/><circle cx="1040" cy="300" r="4.5" fill="#818cf8" class="particle particle-delay-3"/><circle cx="600" cy="60" r="2.5" fill="#38bdf8" class="particle particle-delay-1"/></g><rect width="1196" height="416" x="2" y="2" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity=".3" rx="15"/><g id="foreground-content"><g transform="translate(600, 75)"><rect width="270" height="36" x="-135" y="-18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="18"/><circle cx="-105" cy="0" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="-90" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12.5" font-weight="600">CURATED ECOSYSTEM • 2026</text></g><text x="600" y="160" fill="url(#titleGrad)" class="title-text" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.8))" font-size="46" text-anchor="middle">Awesome E-Commerce Platform</text><text x="600" y="206" fill="#94a3b8" class="subtitle-text" font-size="18.5" text-anchor="middle">A curated collection of leading modern E-Commerce platforms, engines &amp; headless frameworks</text><line x1="450" x2="750" y1="240" y2="240" stroke="url(#titleGrad)" stroke-linecap="round" stroke-width="2" opacity=".6"/><g><g class="pulse-pill" transform="translate(0, 275) translate(185, 0)"><rect width="180" height="52" x="0" y="0" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="12"/><g fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(16, 16)"><circle cx="7" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/><path d="M1 1h3l2.2 10.5a1.8 1.8 0 0 0 1.8 1.5h8.6a1.8 1.8 0 0 0 1.8-1.5L20 5H4.6"/></g><text x="50" y="25" fill="#f8fafc" class="badge-text">Enterprise SaaS</text><text x="50" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="11">Shopify, BigCommerce</text></g><g class="pulse-pill" style="animation-delay:-1s" transform="translate(0, 275) translate(385, 0)"><rect width="195" height="52" x="0" y="0" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".6" stroke-width="1.2" rx="12"/><g fill="none" stroke="#818cf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(16, 16)"><polyline points="13 15 18 10 13 5"/><polyline points="7 5 2 10 7 15"/></g><text x="50" y="