<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .bg-orb {
        animation: floatOrb 12s ease-in-out infinite alternate;
      }
      .bg-orb-2 {
        animation: floatOrb2 15s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .grid-pulse {
        animation: gridFade 6s ease-in-out infinite alternate;
      }
      .particle {
        animation: particleFloat 7s ease-in-out infinite;
      }
      .particle-delay-1 { animation-delay: -2s; }
      .particle-delay-2 { animation-delay: -4s; }
      .particle-delay-3 { animation-delay: -5.5s; }

      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
        100% { transform: translate(-30px, 50px) scale(0.95); }
      }

      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-50px, -20px) scale(1.2); }
        100% { transform: translate(40px, -40px) scale(0.9); }
      }

      @keyframes pulsePill {
        0% { opacity: 0.8; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
        100% { opacity: 0.8; transform: translateY(0); }
      }

      @keyframes gridFade {
        0% { opacity: 0.12; }
        100% { opacity: 0.25; }
      }

      @keyframes particleFloat {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
        50% { transform: translateY(-20px) scale(1.2); opacity: 0.8; }
        100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }

      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- 1. Background layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- 2. Dynamic Ambient Glow Orbs in Background -->
  <g filter="url(#softGlow)" opacity="0.6">
    <circle class="bg-orb" cx="220" cy="140" r="160" fill="#38bdf8" />
    <circle class="bg-orb-2" cx="980" cy="240" r="190" fill="#a855f7" />
    <circle class="bg-orb" cx="620" cy="350" r="130" fill="#6366f1" />
  </g>

  <!-- 3. Grid Pattern Layer -->
  <g class="grid-pulse" stroke="#ffffff" stroke-width="1" stroke-dasharray="3, 3" opacity="0.15">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- 4. Floating ambient tech particles -->
  <g fill="#38bdf8">
    <circle class="particle" cx="180" cy="110" r="3" />
    <circle class="particle particle-delay-1" cx="340" cy="320" r="4" fill="#a855f7" />
    <circle class="particle particle-delay-2" cx="890" cy="90" r="3.5" fill="#c084fc" />
    <circle class="particle particle-delay-3" cx="1040" cy="300" r="4.5" fill="#818cf8" />
    <circle class="particle particle-delay-1" cx="600" cy="60" r="2.5" fill="#38bdf8" />
  </g>

  <!-- 5. Card Border Glow / Framing -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.3" />

  <!-- 6. FOREGROUND CONTENT: Header Tag, Title, Subtitle, & Feature Pills -->
  <g id="foreground-content">
    
    <!-- Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-105" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-90" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto">
        CURATED ECOSYSTEM • 2026
      </text>
    </g>

    <!-- Main Title (Clear Foreground) -->
    <text class="title-text" x="600" y="160" text-anchor="middle" font-size="46" fill="url(#titleGrad)" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.8))">
      Awesome E-Commerce Platform
    </text>

    <!-- Subtitle (Clear Foreground) -->
    <text class="subtitle-text" x="600" y="206" text-anchor="middle" font-size="18.5" fill="#94a3b8">
      A curated collection of leading modern E-Commerce platforms, engines &amp; headless frameworks
    </text>

    <!-- Subtle Divider -->
    <line x1="450" y1="240" x2="750" y2="240" stroke="url(#titleGrad)" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Feature Dynamic Feature Pills (Non-Obstructing at the bottom) -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: SaaS Solutions -->
      <g class="pulse-pill" transform="translate(185, 0)">
        <rect x="0" y="0" width="180" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <!-- Cart Icon -->
        <g transform="translate(16, 16)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="17" r="1.5" />
          <circle cx="16" cy="17" r="1.5" />
          <path d="M1 1h3l2.2 10.5a1.8 1.8 0 0 0 1.8 1.5h8.6a1.8 1.8 0 0 0 1.8-1.5L20 5H4.6" />
        </g>
        <text class="badge-text" x="50" y="25" fill="#f8fafc">Enterprise SaaS</text>
        <text x="50" y="40" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Shopify, BigCommerce</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g class="pulse-pill" style="animation-delay: -1s;" transform="translate(385, 0)">
        <rect x="0" y="0" width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <!-- Code / Git Icon -->
        <g transform="translate(16, 16)" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 15 18 10 13 5" />
          <polyline points="7 5 2 10 7 15" />
        </g>
        <text class="badge-text" x="50" y="25" fill="#f8fafc">Open-Source Stacks</text>
        <text x="50" y="40" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Woo, Shopware, Magento</text>
      </g>

      <!-- Pill 3: Headless & Composable -->
      <g class="pulse-pill" style="animation-delay: -2s;" transform="translate(600, 0)">
        <rect x="0" y="0" width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
        <!-- Layers Icon -->
        <g transform="translate(16, 16)" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="10 1 1 5 10 9 19 5 10 1" />
          <path d="M1 10l9 4 9-4" />
          <path d="M1 15l9 4 9-4" />
        </g>
        <text class="badge-text" x="50" y="25" fill="#f8fafc">Headless &amp; Modern</text>
        <text x="50" y="40" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Medusa, Saleor, Vendure</text>
      </g>

      <!-- Pill 4: Pricing & Comparison -->
      <g class="pulse-pill" style="animation-delay: -3s;" transform="translate(815, 0)">
        <rect x="0" y="0" width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <!-- Tag / Dollar Icon -->
        <g transform="translate(16, 16)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="10" y1="1" x2="10" y2="19" />
          <path d="M14 5H8a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H6" />
        </g>
        <text class="badge-text" x="48" y="25" fill="#f8fafc">Pricing &amp; Tiers</text>
        <text x="48" y="40" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Tier limits &amp; Free models</text>
      </g>
    </g>

    <!-- Footer Stats / Meta indicators -->
    <g transform="translate(600, 375)">
      <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto">
        ✨ Free &amp; Open-Source Friendly • Headless Ready • SaaS &amp; Self-Hosted
      </text>
    </g>
  </g>
</svg>
